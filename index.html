
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHONDRO MUSIC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101426;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px 10px;
      background: #182442;
    }
    h1 { color: #45b6ff; }
    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }
    .tool {
      background: #202e4c;
      padding: 25px 10px;
      border-radius: 14px;
    }
    .tool a {
      color: #65c5ff;
      text-decoration: none;
    }
    footer { padding: 25px; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>CHONDRO MUSIC</h1>
    <p>Welcome to Free Online Tools</p>
  </header>

  <h2>Our Online Tools</h2>

  <div class="tools">
    <div class="tool">🔢<p>Calculator</p></div>
    <div class="tool">🔳<p>QR Code Tool</p></div>
    <div class="tool">🔤<p>Text Tools</p></div>
    <div class="tool">🎵<p>Music Tools</p></div>
  </div>

  <footer>
    © 2026 CHONDRO MUSIC
  </footer>
</body>
</html>
